<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CLOTHES SHOP</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #ffffff;
        }

        h1 {
            margin-bottom: 10px;
        }

        .note {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .item {
            margin-bottom: 30px;
        }

        .item img {
            width: 350px;
            max-width: 90%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <h1>
        <mark>ITEM LISTS</mark>
    </h1>

    <p class="note">
        Note: Hình trước, giá tiền ngay bên dưới
    </p>

    <div class="item">
        <img src="images/Hexkitty.jpg"
             alt="Hexkitty"
             title="Hexkitty">
        <p class="price">150k</p>
    </div>

    <div class="item">
        <img src="images/Keyue.jpg"
             alt="Keyue"
             title="Keyue">
        <p class="price">40k</p>
    </div>

    <div class="item">
        <img src="images/Caring.jpg"
             alt="Caring"
             title="Caring">
        <p class="price">25k</p>
    </div>

    <div class="item">
        <img src="images/Cool.jpg"
             alt="Cool"
             title="Cool">
        <p class="price">20k</p>
    </div>

    <div class="item">
        <img src="images/Dawn.jpg"
             alt="Dawn"
             title="Dawn">
        <p class="price">35k</p>
    </div>

    <div class="item">
        <img src="images/Debut.jpg"
             alt="Debut"
             title="Debut">
        <p class="price">35k</p>
    </div>

    <div class="item">
        <img src="images/Mike.jpg"
             alt="Mike"
             title="Mike">
        <p class="price">20k</p>
    </div>

    <div class="item">
        <img src="images/Sugar.jpg"
             alt="Sugar"
             title="Sugar">
        <p class="price">25k</p>
    </div>

</body>

</html>
